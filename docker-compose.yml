# Окружение целиком поднимается одной командой с одним из брокеров:
#   docker compose --profile rabbitmq up --build
#   docker compose --profile kafka up --build
# Профиль выбирает и брокер, и server/worker, настроенные на него (BROKER),
# поэтому одновременно включать оба профиля не нужно.
#
# Профиль observability добавляет метрики, трейсы, логи и дашборды:
#   docker compose --profile observability --profile rabbitmq up --build
name: gophprofile

# Общие настройки server и worker. Отличаются только BROKER и зависимостью от брокера.
x-app-env: &app-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URI: postgres://${POSTGRES_USER:-gophprofile}:${POSTGRES_PASSWORD:-gophprofile}@postgres:5432/${POSTGRES_DB:-gophprofile}?sslmode=disable
  S3_ENDPOINT: seaweedfs:8333
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-avatars}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-gophprofile}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-gophprofile-secret}
  S3_USE_SSL: "false"
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-gophprofile}:${RABBITMQ_PASSWORD:-gophprofile}@rabbitmq:5672/
  KAFKA_BROKERS: kafka:9092
  # Без профиля observability Jaeger нет: спаны теряются, сервис работает.
  OTEL_EXPORTER_OTLP_ENDPOINT: jaeger:4317
  OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1}
  DEPLOYMENT_ENVIRONMENT: docker

x-server: &server
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: server
  image: gophprofile-server
  restart: unless-stopped
  ports:
    - "${APP_PORT:-8080}:8080"
  # Одно имя у server любого профиля: Prometheus находит его по DNS.
  networks:
    default:
      aliases: [avatar-service]

x-worker: &worker
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: worker
  image: gophprofile-worker
  restart: unless-stopped
  networks:
    default:
      aliases: [avatar-worker]

services:
  server-rabbitmq:
    <<: *server
    profiles: ["rabbitmq"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      BROKER: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # worker стартует после server: миграции применяет server.
  worker-rabbitmq:
    <<: *worker
    profiles: ["rabbitmq"]
    environment:
      <<: *app-env
      BROKER: rabbitmq
    depends_on:
      server-rabbitmq:
        condition: service_healthy

  server-kafka:
    <<: *server
    profiles: ["kafka"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      BROKER: kafka
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  worker-kafka:
    <<: *worker
    profiles: ["kafka"]
    environment:
      <<: *app-env
      BROKER: kafka
    depends_on:
      server-kafka:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: gophprofile-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gophprofile}
      POSTGRES_USER: ${POSTGRES_USER:-gophprofile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gophprofile}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Метрики SeaweedFS (аналог /minio/v2/metrics/cluster у MinIO) — на :9327.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: gophprofile-seaweedfs
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<JSON
        {"identities":[{"name":"app","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        JSON
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -metricsPort=9327
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-gophprofile}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-gophprofile-secret}
    ports:
      - "${S3_PORT:-8333}:8333"
      - "${S3_FILER_PORT:-8888}:8888"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  s3-init:
    image: amazon/aws-cli:2.38.4
    container_name: gophprofile-s3-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket "$${S3_BUCKET}" 2>/dev/null \
          || aws --endpoint-url http://seaweedfs:8333 s3 mb "s3://$${S3_BUCKET}"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-gophprofile}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-gophprofile-secret}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-avatars}
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: gophprofile-rabbitmq
    restart: unless-stopped
    profiles: ["rabbitmq"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gophprofile}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gophprofile}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"     # AMQP
      - "${RABBITMQ_UI_PORT:-15672}:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Плагин rabbitmq_prometheus отдаёт метрики на :15692 (глубина очередей и DLQ).
      - ./deploy/observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: gophprofile-kafka
    restart: unless-stopped
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

  # --- Наблюдаемость (профиль observability) ---
  # Порты — в .env.example. Конфиги — в deploy/observability/.

  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: gophprofile-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      # exemplars: из графика длительности можно перейти к трейсу.
      - --enable-feature=exemplar-storage
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 10s
      timeout: 3s
      retries: 10

  jaeger:
    image: jaegertracing/jaeger:2.21.0
    container_name: gophprofile-jaeger
    restart: unless-stopped
    profiles: ["observability"]
    # all-in-one: приём OTLP (4317 gRPC, 4318 HTTP), хранение в памяти, UI.
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_GRPC_PORT:-4317}:4317"
      - "${OTLP_HTTP_PORT:-4318}:4318"

  loki:
    image: grafana/loki:3.7.9
    container_name: gophprofile-loki
    restart: unless-stopped
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./deploy/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - ./deploy/observability/loki/rules:/etc/loki/rules:ro
      - loki-data:/loki

  # Alloy читает stdout всех контейнеров проекта через docker socket и шлёт в Loki.
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: gophprofile-alloy
    restart: unless-stopped
    profiles: ["observability"]
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./deploy/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:13.2.5
    container_name: gophprofile-grafana
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Дашборды открываются без входа, но менять их можно только админу.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      - prometheus
      - loki
      - jaeger

  # CPU и память контейнеров.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    container_name: gophprofile-cadvisor
    restart: unless-stopped
    profiles: ["observability"]
    privileged: true
    devices:
      - /dev/kmsg
    command:
      - --docker_only=true
      - --housekeeping_interval=15s
      - --store_container_labels=false
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  # Consumer lag и глубина DLQ Kafka. Compose не умеет «оба профиля сразу»,
  # поэтому exporter едет с профилем kafka: без Prometheus он просто простаивает.
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.10.0
    container_name: gophprofile-kafka-exporter
    restart: unless-stopped
    profiles: ["kafka"]
    command: ["--kafka.server=kafka:9092"]
    ports:
      - "${KAFKA_EXPORTER_PORT:-9308}:9308"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres-data:
  seaweedfs-data:
  rabbitmq-data:
  kafka-data:
  prometheus-data:
  loki-data:
  alloy-data:
  grafana-data:
