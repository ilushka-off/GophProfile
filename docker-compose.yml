# Окружение целиком поднимается одной командой с одним из брокеров:
#   docker compose --profile rabbitmq up --build
#   docker compose --profile kafka up --build
# Профиль выбирает и брокер, и server/worker, настроенные на него (BROKER),
# поэтому одновременно включать оба профиля не нужно.
name: gophprofile

# Общие настройки server и worker. Отличаются только BROKER и зависимостью от брокера.
x-app-env: &app-env
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URI: postgres://${POSTGRES_USER:-gophprofile}:${POSTGRES_PASSWORD:-gophprofile}@postgres:5432/${POSTGRES_DB:-gophprofile}?sslmode=disable
  S3_ENDPOINT: seaweedfs:8333
  S3_REGION: us-east-1
  S3_BUCKET: ${S3_BUCKET:-avatars}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-gophprofile}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-gophprofile-secret}
  S3_USE_SSL: "false"
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-gophprofile}:${RABBITMQ_PASSWORD:-gophprofile}@rabbitmq:5672/
  KAFKA_BROKERS: kafka:9092

x-server: &server
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: server
  image: gophprofile-server
  restart: unless-stopped
  ports:
    - "${APP_PORT:-8080}:8080"

x-worker: &worker
  build:
    context: .
    dockerfile: docker/Dockerfile
    target: worker
  image: gophprofile-worker
  restart: unless-stopped

services:
  server-rabbitmq:
    <<: *server
    profiles: ["rabbitmq"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      BROKER: rabbitmq
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # worker стартует после server: миграции применяет server.
  worker-rabbitmq:
    <<: *worker
    profiles: ["rabbitmq"]
    environment:
      <<: *app-env
      BROKER: rabbitmq
    depends_on:
      server-rabbitmq:
        condition: service_healthy

  server-kafka:
    <<: *server
    profiles: ["kafka"]
    environment:
      <<: *app-env
      HTTP_ADDR: ":8080"
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-10485760}
      RATE_LIMIT_RPS: ${RATE_LIMIT_RPS:-20}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-40}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      BROKER: kafka
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy

  worker-kafka:
    <<: *worker
    profiles: ["kafka"]
    environment:
      <<: *app-env
      BROKER: kafka
    depends_on:
      server-kafka:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    container_name: gophprofile-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gophprofile}
      POSTGRES_USER: ${POSTGRES_USER:-gophprofile}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gophprofile}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Метрики SeaweedFS (аналог /minio/v2/metrics/cluster у MinIO) — на :9327.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: gophprofile-seaweedfs
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<JSON
        {"identities":[{"name":"app","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        JSON
        exec weed server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0 -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -metricsPort=9327
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-gophprofile}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-gophprofile-secret}
    ports:
      - "${S3_PORT:-8333}:8333"
      - "${S3_FILER_PORT:-8888}:8888"
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  s3-init:
    image: amazon/aws-cli:2.38.4
    container_name: gophprofile-s3-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket "$${S3_BUCKET}" 2>/dev/null \
          || aws --endpoint-url http://seaweedfs:8333 s3 mb "s3://$${S3_BUCKET}"
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-gophprofile}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-gophprofile-secret}
      AWS_DEFAULT_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-avatars}
    restart: "no"

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: gophprofile-rabbitmq
    restart: unless-stopped
    profiles: ["rabbitmq"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gophprofile}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-gophprofile}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"     # AMQP
      - "${RABBITMQ_UI_PORT:-15672}:15672" # management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      # Плагин rabbitmq_prometheus отдаёт метрики на :15692 (глубина очередей и DLQ).
      - ./deploy/observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.1
    container_name: gophprofile-kafka
    restart: unless-stopped
    profiles: ["kafka"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:${KAFKA_EXTERNAL_PORT:-9094}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9094}:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s

volumes:
  postgres-data:
  seaweedfs-data:
  rabbitmq-data:
  kafka-data:
