{{- /* Учётки зависимостей. Только для локального кластера. */ -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "infra.secretName" . }}
  labels:
    {{- include "infra.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  RABBITMQ_DEFAULT_PASS: {{ .Values.rabbitmq.password | quote }}
  # Конфиг S3-шлюза SeaweedFS: одна учётка с полными правами.
  s3.json: |-
    {{- dict "identities" (list (dict "name" "app" "credentials" (list (dict "accessKey" .Values.s3.accessKey "secretKey" .Values.s3.secretKey)) "actions" (list "Admin" "Read" "Write" "List" "Tagging"))) | toJson | nindent 4 }}
