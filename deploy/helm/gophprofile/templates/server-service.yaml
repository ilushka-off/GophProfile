{{- $ctx := dict "ctx" $ "component" "server" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gophprofile.fullname" . }}-server
  labels:
    {{- include "gophprofile.componentLabels" $ctx | nindent 4 }}
spec:
  type: {{ .Values.server.service.type }}
  selector:
    {{- include "gophprofile.componentSelectorLabels" $ctx | nindent 4 }}
  # Порты именованные: Ingress и ServiceMonitor ссылаются на них по имени.
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9091
      targetPort: metrics
      protocol: TCP
