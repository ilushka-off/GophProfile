{{- /*
Несекретные настройки server и worker. Ключи совпадают с именами env,
которые читает internal/config, и подключаются через envFrom.
*/ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gophprofile.configMapName" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
data:
  BROKER: {{ .Values.broker.type | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  MAX_UPLOAD_SIZE: {{ .Values.config.maxUploadSize | int64 | toString | quote }}
  S3_ENDPOINT: {{ required "config.s3.endpoint обязателен" .Values.config.s3.endpoint | quote }}
  S3_BUCKET: {{ .Values.config.s3.bucket | quote }}
  S3_REGION: {{ .Values.config.s3.region | quote }}
  S3_USE_SSL: {{ .Values.config.s3.useSSL | toString | quote }}
  {{- if eq .Values.broker.type "kafka" }}
  KAFKA_BROKERS: {{ required "config.kafkaBrokers обязателен при broker.type=kafka" .Values.config.kafkaBrokers | quote }}
  {{- end }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.otel.endpoint | quote }}
  OTEL_TRACES_SAMPLER_ARG: {{ .Values.config.otel.samplerArg | toString | quote }}
  DEPLOYMENT_ENVIRONMENT: {{ .Values.config.environment | quote }}
  # /metrics (и у worker'а пробы) — на отдельном порту, который Ingress не публикует.
  METRICS_ADDR: ":9091"
  HTTP_ADDR: ":8080"
  # Миграции применяет Helm-хук до выката подов, а не каждый под при старте.
  MIGRATE_ON_START: "false"
  SHUTDOWN_DELAY: {{ .Values.server.shutdownDelay | quote }}
  RATE_LIMIT_RPS: {{ .Values.config.rateLimit.rps | toString | quote }}
  RATE_LIMIT_BURST: {{ .Values.config.rateLimit.burst | toString | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.config.corsAllowedOrigins | quote }}
