{{- /*
ServiceAccount без токена API. Приложение не ходит в Kubernetes API,
поэтому Role и RoleBinding не создаются: минимальные права — отсутствие прав.
Если понадобится доступ к API, под него — отдельный Role только с нужными verbs.
Аккаунт нужен и Job миграций (pre-install), поэтому он тоже хук с весом -10.
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gophprofile.serviceAccountName" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end }}
