{{- /*
ServiceMonitor server и worker по порту metrics. Рендерится, только если в
кластере есть CRD Prometheus Operator: без kube-prometheus-stack чарт ставится
без ошибок. jobLabel: app — job в Prometheus будет avatar-service и
avatar-worker, как в docker compose, и дашборды с алертами работают без правок.
*/ -}}
{{- if include "gophprofile.monitoringAvailable" . }}
{{- range $component := list "server" "worker" }}
{{- $ctx := dict "ctx" $ "component" $component }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "gophprofile.fullname" $ }}-{{ $component }}
  labels:
    {{- include "gophprofile.componentLabels" $ctx | nindent 4 }}
    {{- with $.Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  jobLabel: app
  selector:
    matchLabels:
      {{- include "gophprofile.componentSelectorLabels" $ctx | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ $.Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ $.Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ $.Values.monitoring.serviceMonitor.scrapeTimeout }}
      # instance — имя пода, а не IP: IP меняется при каждом перезапуске.
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: instance
{{- end }}
{{- end }}
