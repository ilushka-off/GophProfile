{{- /*
Дашборды этапа 2 — по ConfigMap на файл с лейблом grafana_dashboard: их
подхватывает sidecar Grafana из kube-prometheus-stack. JSON общий с docker
compose (dashboards/ в чарте). Не зависят от CRD, но имеют смысл только с
Grafana, поэтому включаются вместе с monitoring.enabled.
*/ -}}
{{- if and .Values.monitoring.enabled .Values.monitoring.dashboards.enabled }}
{{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
{{- $file := base $path }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "gophprofile.fullname" $ }}-dashboard-{{ trimSuffix ".json" $file }}
  labels:
    {{- include "gophprofile.labels" $ | nindent 4 }}
    {{- toYaml $.Values.monitoring.dashboards.labels | nindent 4 }}
  annotations:
    grafana_folder: {{ $.Values.monitoring.dashboards.folder | quote }}
data:
  {{ $file }}: |-
    {{- $.Files.Get $path | nindent 4 }}
{{- end }}
{{- end }}
