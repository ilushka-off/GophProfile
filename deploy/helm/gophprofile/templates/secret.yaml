{{- /*
Secret рендерится, только если не задан secret.existingSecret (local).
Миграции (pre-install) запускаются до обычных ресурсов чарта, поэтому
Secret тоже хук с весом -10: он создаётся раньше Job миграций.
hook-delete-policy before-hook-creation пересоздаёт его на каждом upgrade,
а при helm uninstall хук-ресурсы не удаляются — Secret удаляется вручную
(make k8s-down делает это вместе с namespace).
*/ -}}
{{- if not .Values.secret.existingSecret }}
{{- $v := .Values.secret.values }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gophprofile.secretName" . }}
  labels:
    {{- include "gophprofile.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  DATABASE_URI: {{ required "secret.values.DATABASE_URI обязателен (или secret.existingSecret)" $v.DATABASE_URI | quote }}
  S3_ACCESS_KEY: {{ required "secret.values.S3_ACCESS_KEY обязателен (или secret.existingSecret)" $v.S3_ACCESS_KEY | quote }}
  S3_SECRET_KEY: {{ required "secret.values.S3_SECRET_KEY обязателен (или secret.existingSecret)" $v.S3_SECRET_KEY | quote }}
  {{- if eq .Values.broker.type "rabbitmq" }}
  RABBITMQ_URL: {{ required "secret.values.RABBITMQ_URL обязателен при broker.type=rabbitmq" $v.RABBITMQ_URL | quote }}
  {{- end }}
{{- end }}
