# Grafana Alloy DaemonSet: читает файлы логов подов своего узла
# (/var/log/pods) вместо docker socket и шлёт их в Loki.
controller:
  type: daemonset

alloy:
  mounts:
    # /var/log с узла: там логи контейнеров, которые пишет kubelet.
    varlog: true
  configMap:
    content: |
      // Поды этого узла. HOSTNAME чарт alloy задаёт из spec.nodeName.
      discovery.kubernetes "pods" {
        role = "pod"
        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("HOSTNAME")
        }
      }

      // Лейблы — как в docker compose: service, level, плюс namespace, pod,
      // container. trace_id, avatar_id, user_id остаются в теле строки (JSON).
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        // У чужих подов service — app.kubernetes.io/name, а без него — имя
        // контейнера. У server и worker его заменит поле service из JSON
        // (avatar-service, avatar-worker).
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "service"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          regex         = "(.+)"
          target_label  = "service"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
          separator     = "/"
          replacement   = "/var/log/pods/*$1/*.log"
          target_label  = "__path__"
        }
      }

      local.file_match "pods" {
        path_targets = discovery.relabel.pods.output
      }

      loki.source.file "pods" {
        targets    = local.file_match.pods.targets
        forward_to = [loki.process.pods.receiver]
      }

      // Формат CRI (время, поток, флаг) снимается, затем JSON-логи server
      // и worker дают level и service.
      loki.process "pods" {
        stage.cri {}

        stage.json {
          expressions = {
            level   = "level",
            service = "service",
          }
        }

        stage.labels {
          values = {
            level   = "",
            service = "",
          }
        }

        forward_to = [loki.write.default.receiver]
      }

      loki.write "default" {
        endpoint {
          url = "http://loki.monitoring:3100/loki/api/v1/push"
        }
      }
