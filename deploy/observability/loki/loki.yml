# Loki в одном процессе с хранением на диске контейнера (volume loki-data).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  storage:
    filesystem:
      chunks_directory: /loki/chunks
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Как у метрик в Prometheus: неделя.
  retention_period: 168h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Правила алертов по логам лежат в репозитории: deploy/observability/loki/rules
# смонтирован в /etc/loki/rules. Без авторизации арендатор Loki — "fake",
# поэтому правила — в подкаталоге fake/. Сработавшие алерты уходят
# в Alertmanager и видны в Grafana → Alerting (источник Loki).
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  enable_api: true
  evaluation_interval: 1m
  ring:
    kvstore:
      store: inmemory

analytics:
  reporting_enabled: false
