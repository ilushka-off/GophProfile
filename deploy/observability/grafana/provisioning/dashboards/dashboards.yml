# Дашборды как код: JSON из deploy/helm/gophprofile/dashboards (те же файлы
# в Kubernetes едут в ConfigMap с лейблом grafana_dashboard).
# Правки в UI не сохраняются — меняйте файлы.
apiVersion: 1

providers:
  - name: gophprofile
    folder: GophProfile
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
