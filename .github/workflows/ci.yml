name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Интеграционные тесты поднимают контейнеры через testcontainers:
      # Docker на раннере есть.
      - run: make cover

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make lint

  alerts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: make alerts-test ENV_FILE=/dev/null
