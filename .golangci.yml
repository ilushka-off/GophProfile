version: "2"

run:
  timeout: 5m
  tests: true

linters:
  # standard: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - errorlint
    - gocritic
    - misspell
    - nilerr
    - noctx
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - unconvert
    - unparam
    - usestdlibvars
    - whitespace
  settings:
    errcheck:
      # Close в defer у тел ответов и файлов проверять бессмысленно.
      exclude-functions:
        - (io.Closer).Close
        - (*os.File).Close
    govet:
      enable-all: true
      disable:
        # Порядок полей ради выравнивания хуже читается, а выигрыш копеечный.
        - fieldalignment
        - shadow
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - hugeParam
    misspell:
      locale: US
  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      # В тестах контекст запроса не важен, httptest.NewRequest проще читается.
      - path: _test\.go
        linters:
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - go-avatar-service
